experiment_name: observation_period_exp
experiment_name_human: "Optimizing on Different History Lengths"
plot_on_one_panel: true
trials:
  - trial_id: ground_truth
    trial_id_human: "Target day (oracle)"
    formatting_id_of_final_point: ground_truth
    overrides:
      tuner_config.forecast_config.forecast_policy: GroundTruthForecastPolicy

  - trial_id: prev_day
    trial_id_human: "Previous 1 day"
    formatting_id_of_final_point: prev_day

  - trial_id: prev_week
    trial_id_human: "Previous 1 week"
    formatting_id_of_final_point: prev_week
    overrides:
      tuner_config.forecast_config.history_abs_start_time_start: "2024-05-20T00:00:00"

  - trial_id: prev_month
    trial_id_human: "Previous 1 month"
    formatting_id_of_final_point: prev_month
    overrides:
      tuner_config.forecast_config.history_abs_start_time_start: "2024-04-27T00:00:00"

 