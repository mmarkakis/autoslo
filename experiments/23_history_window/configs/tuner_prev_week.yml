# History-window experiment: previous week (May 20 – May 26)
target_period:
  start: "2024-05-27T00:00:00"
  end: "2024-05-28T00:00:00"
history_period:
  start: "2024-05-20T00:00:00"
  end: "2024-05-27T00:00:00"

num_scenarios: 20
train_fraction: 0.6
random_seed: 42
forecast_policy: recency_weighted  # 7 days — recency weighting useful
aggregation_metric: p90
holdout_evaluation: true
classify_arrivals: true
parallelism: auto
rescale_factor: 0.1666667  # 24h → 4h (factor = 1/6)

checkpoint_budget: 5
checkpoint_epsilon: 0.01
sliding_window_s: 300.0
violation_threshold: 0.1

autoscaler_ranges:
  eta_crit: [0.05, 0.10, 0.20]
  idle_periods_before_tear_down: [5, 10, 20]
  capacity_poll_interval_s: [30.0, 60.0, 120.0]
  min_cluster_lifetime_s: [1200.0, 3600.0]
routing_ranges: {}

static_baselines:
  - label: "4 RPU"
    overrides:
      managed_cluster_pool_config.initial_rpus: [4]
      autoscaling_config.autoscaling_policy: "noop"
      autoscaling_config.capacity_checkpoints: []
      routing_config.routing_policy: "round_robin"
  - label: "8 RPU"
    overrides:
      managed_cluster_pool_config.initial_rpus: [8]
      autoscaling_config.autoscaling_policy: "noop"
      autoscaling_config.capacity_checkpoints: []
      routing_config.routing_policy: "round_robin"
  - label: "16 RPU"
    overrides:
      managed_cluster_pool_config.initial_rpus: [16]
      autoscaling_config.autoscaling_policy: "noop"
      autoscaling_config.capacity_checkpoints: []
      routing_config.routing_policy: "round_robin"
  - label: "32 RPU"
    overrides:
      managed_cluster_pool_config.initial_rpus: [32]
      autoscaling_config.autoscaling_policy: "noop"
      autoscaling_config.capacity_checkpoints: []
      routing_config.routing_policy: "round_robin"
