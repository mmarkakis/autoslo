# History-window experiment: ground truth (oracle — optimize on the real May 27 workload)
# This scenario answers "what's the best policy if you already know the exact workload?",
# serving as an upper-bound benchmark against the forecasted-history scenarios.

basic_config:
  iconq_model_id: "1771539369"
  run_id: "tuner_ground_truth"

workload_config:
  schema_name: ext_tpcds1000
  workload_name: redbench_provisioned_157_0
  date: "2024-05-27"
  rescale_factor: 0.16666667
  closed_loop: false

slo_config:
  slo_s: 30.0
  slo_metric: binary
  slo_threshold: 0.05
  slo_dict_filename: ext_tpcds1000_rpu16_p90_k4.0.yml

runner_config:
  max_threads: 512

provisioner_config:
  relative_aws_config_path: data/__run_configs/aws.yml
  spin_up_delay_s: 300.0

managed_cluster_pool_config:
  maxconns: 1000
  initial_rpus:
    - 16

routing_config:
  routing_policy: use_iconq_model

autoscaling_config:
  allowed_rpu_sizes:
    - 4
    - 8
    - 16
    - 32
  min_cluster_lifetime_s: 1200.0
  idle_time_before_tear_down_s: 1200.0
  observation_window_s: 300.0
  min_observations_to_act: 5
  slo_tightening_factor: 0.8

output_config:
  experiment_name: history_window_exp
  overwrite_experiment: false
  write_text_log: false

tuner_config:
  force: true
  parallelism: auto
  holdout_evaluation: true
  seed: 42

  forecast_config:
    # "GroundTruthForecastPolicy" is a sentinel that bypasses reservoir
    # sampling and uses the real target-day workload directly.
    forecast_policy: GroundTruthForecastPolicy
    aggregation_metric: mean

  checkpoint_phase:
    max_checkpoints: 5
    min_delinquent_workload_fraction: 0.5
    min_rel_improvement_for_acceptance: 0.01
    initial_rpu_candidates:
      - [16]
      - [8]
      - [32]

  autoscaling_param_sweep:
    strategy: grid
    params:
      "autoscaling_config.min_cluster_lifetime_s": [1200.0, 3600.0]
      "autoscaling_config.idle_time_before_tear_down_s": [300.0, 600.0]
      "autoscaling_config.observation_window_s": [120.0, 300.0]
      "autoscaling_config.min_observations_to_act": [5, 10]
      "autoscaling_config.slo_tightening_factor": [0.6, 0.8, 1.0]
  routing_param_sweep: {}

  static_baselines:
    - label: "16 RPU"
      overrides:
        managed_cluster_pool_config.initial_rpus: [16]
        autoscaling_config.allowed_rpu_sizes: []
        autoscaling_config.capacity_checkpoints: []
        routing_config.routing_policy: "round_robin"
    - label: "16+16 RPU"
      overrides:
        managed_cluster_pool_config.initial_rpus: [16, 16]
        autoscaling_config.allowed_rpu_sizes: []
        autoscaling_config.capacity_checkpoints: []
        routing_config.routing_policy: "round_robin"
    - label: "32 RPU"
      overrides:
        managed_cluster_pool_config.initial_rpus: [32]
        autoscaling_config.allowed_rpu_sizes: []
        autoscaling_config.capacity_checkpoints: []
        routing_config.routing_policy: "round_robin"
    - label: "32+32 RPU"
      overrides:
        managed_cluster_pool_config.initial_rpus: [32, 32]
        autoscaling_config.allowed_rpu_sizes: []
        autoscaling_config.capacity_checkpoints: []
        routing_config.routing_policy: "round_robin"
    - label: "64 RPU"
      overrides:
        managed_cluster_pool_config.initial_rpus: [64]
        autoscaling_config.allowed_rpu_sizes: []
        autoscaling_config.capacity_checkpoints: []
        routing_config.routing_policy: "round_robin"
