# History-window experiment: previous day only (May 26)

basic_config:
  schema_name: ext_tpcds1000
  experiment_name: history_window_exp
  overwrite: true
  iconq_model_id: "1771539369"
  run_id: "tuner_prev_day"

workload_config:
  workload_name: redbench_provisioned_157_0
  abs_start_time_start: "2024-05-27T00:00:00"
  abs_start_time_end: "2024-05-28T00:00:00"
  rescale_factor: 0.16666667
  closed_loop: false

slo_config:
  slo_s: 30.0
  slo_metric: relative
  slo_threshold: 0.05
  slo_dict_filename: ext_tpcds1000_rpu16_p90_k4.0.yml

managed_cluster_pool_config:
  initial_rpus:
    - 16
  allowed_rpu_sizes:
    - 4
    - 8
    - 16
    - 32
  spin_up_delay_s: 300.0

routing_config:
  routing_policy: model

autoscaling_config:
  autoscaling_policy: headroom
  eta_crit: 0.05
  idle_periods_before_tear_down: 20
  capacity_poll_interval_s: 60.0
  min_cluster_lifetime_s: 1200.0
  capacity_checkpoints: []

output_config:
  verbose: false
  export_video: false


tuner_config:
  forecast_config:
    history_abs_start_time_start: "2024-05-26T00:00:00"
    history_abs_start_time_end: "2024-05-27T00:00:00"
    forecast_policy: OneDayForecastPolicy
    decay_factor: 0.5
    num_scenarios: 20
    train_fraction: 0.6
    initial_seed: 42
    aggregation_metric: max
  
  parallelism: auto
  holdout_evaluation: true

  checkpoint_phase:
    checkpoint_budget: 5
    checkpoint_epsilon: 0.01
    violation_threshold: 0.1

  autoscaler_sweep_phase:
    eta_crit: [0.05, 0.10, 0.20]
    idle_periods_before_tear_down: [5, 10, 20]
    capacity_poll_interval_s: [30.0, 60.0, 120.0]
    min_cluster_lifetime_s: [1200.0, 3600.0]

  routing_sweep_phase: {}

  static_baselines:
    - label: "4 RPU"
      overrides:
        managed_cluster_pool_config.initial_rpus: [4]
        autoscaling_config.autoscaling_policy: "noop"
        autoscaling_config.capacity_checkpoints: []
        routing_config.routing_policy: "round_robin"
    - label: "8 RPU"
      overrides:
        managed_cluster_pool_config.initial_rpus: [8]
        autoscaling_config.autoscaling_policy: "noop"
        autoscaling_config.capacity_checkpoints: []
        routing_config.routing_policy: "round_robin"
    - label: "16 RPU"
      overrides:
        managed_cluster_pool_config.initial_rpus: [16]
        autoscaling_config.autoscaling_policy: "noop"
        autoscaling_config.capacity_checkpoints: []
        routing_config.routing_policy: "round_robin"
    - label: "32 RPU"
      overrides:
        managed_cluster_pool_config.initial_rpus: [32]
        autoscaling_config.autoscaling_policy: "noop"
        autoscaling_config.capacity_checkpoints: []
        routing_config.routing_policy: "round_robin"
