site_name: Autoslo

repo_url: https://github.com/mmarkakis/autoslo
repo_name: mmarkakis/autoslo

theme:
  name: material
  language: en

  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - content.code.copy

  icon:
    repo: fontawesome/brands/github


  palette: 

    # Palette toggle for light mode
    - scheme: default
      primary: green
      accent: amber
      toggle:
        icon: material/weather-night 
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      primary: green
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode


plugins:
- search
- gen-files:
      scripts:
        - docs/gen_ref_pages.py
- literate-nav:
    nav_file: docs/SUMMARY.md
- section-index
- mkdocstrings:
    handlers:
      python:
        paths: [src]
        options:
            docstring_style: google
            docstring_options:
              show_if_no_docstring: true
            show_source: true
            members_order: "source"
            filters: [".*"]

extra_css:
  - assets/generated/palette.css

