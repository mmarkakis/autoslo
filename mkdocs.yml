site_name: Chunkload

repo_url: https://github.com/mmarkakis/chunkload
repo_name: mmarkakis/chunkload

theme:
  name: material
  language: en

  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - content.code.copy

  icon:
    repo: fontawesome/brands/github


  palette: 

    # Palette toggle for light mode
    - scheme: default
      primary: green
      accent: amber
      toggle:
        icon: material/weather-night 
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      primary: green
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode


plugins:
- search
- gen-files:
      scripts:
        - docs/gen_ref_pages.py
- literate-nav:
    nav_file: docs/SUMMARY.md
- section-index
- mkdocstrings:
    handlers:
      python:
        setup_commands:
            - import sys
            - sys.path.append("src")
        paths: [src]
        options:
            docstring_style: google
            docstring_options:
              show_if_no_docstring: true
            show_source: true
            members_order: "source"
            filters: [".*"]
            show_type_annotations: true

extra_css:
  - assets/generated/palette.css

nav:
  - Home: index.md
  - Docs: 
    - Building Blocks: 
      - "Chunk": reference/chunkload/building_blocks/chunk.md
      - "Day": reference/chunkload/building_blocks/day.md
      - "Composite": reference/chunkload/building_blocks/composite.md
    

  
markdown_extensions:
    - markdown_include.include:
        base_path: .
    - pymdownx.highlight:
        anchor_linenums: true
        line_spans: __span
        pygments_lang_class: true
    - pymdownx.inlinehilite
    - pymdownx.snippets
    - pymdownx.superfences
    - tables