name: Deploy docs

on:
  push:
    branches:
      - main
    paths:
      - "src/**/*.py"
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install docs dependencies
        # Installs only the docs extras; heavy runtime deps (torch, xgboost, …)
        # are intentionally excluded. gen_ref_pages.py handles missing imports
        # gracefully via try/except, and mkdocstrings uses Griffe for static
        # analysis so the full package need not be importable.
        run: pip install "mkdocs>=1.6" "mkdocs-material>=9.5" "mkdocstrings[python]>=0.25" "mkdocs-literate-nav>=0.6" "mkdocs-section-index>=0.3" "mkdocs-gen-files>=0.5" "markdown-include>=0.8"

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
