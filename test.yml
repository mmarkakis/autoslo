# History-window experiment: previous month (Apr 27 - May 26)

basic_config:
  iconq_model_id: "1771539369"
  run_id: "tuner_prev_month"

workload_config:
  workload_name: redbench_provisioned_157_0
  start_date_inclusive: "2024-05-27"
  end_date_inclusive: "2024-05-27"
  rescale_factor: 0.16666667

reservoir_config:
  workload_name: redbench_provisioned_157_0
  start_date_inclusive: "2024-04-27"
  end_date_inclusive: "2024-05-26"
  rescale_factor: 0.16666667

forecaster_config:
  forecast_policy_name: same_day_exponential
  decay_factor: 0.5
  fixed_queries_per_hour: 100

slo_resolver_config:
  slo_s: 30.0
  slo_dict_filename: ext_tpcds1000_rpu16_p90_k4.0.yml

slo_objective_config:
  slo_metric: binary
  slo_threshold: 0.05

workload_runner_config:
  max_threads: 512
  schema_name: ext_tpcds1000
  closed_loop: false

provisioner_config:
  aws_config_path: data/__run_configs/aws.yml
  spin_up_delay_s: 300.0

managed_cluster_pool_config:
  maxconns: 1000
  max_clusters: 10
  initial_rpus:
    - 16

# capacity_checkpoints: 
#   - rel_time_s: 5438.450446128845
#     min_rpus:
#     - 16
#     - 16

query_router_config:
  routing_policy_name: cache_aware
  cluster_cache_state_update_alpha: 0.7
  cache_risk_cost_multiplier: 0.0

autoscaler_config:
  allowed_rpu_sizes:
    - 4
    - 8
    - 16
    - 32
  min_cluster_lifetime_s: 1200.0
  idle_time_before_tear_down_s: 1200.0
  observation_window_s: 300.0
  min_observations_to_act: 5
  slo_tightening_factor: 0.8

sampling_config:
  num_scenarios: 20
  seed: 42
  train_fraction: 0.6
  aggregation_method: mean

tuner_config:
  force: true
  parallelism: auto
  holdout_evaluation: true
  

  

  checkpoint_phase:
    max_checkpoints: 5
    min_delinquent_workload_fraction: 0.5
    min_rel_improvement_for_acceptance: 0.01
    initial_rpu_candidates:
      - [ 16 ]
      - [ 8 ]
      - [ 32 ]

  autoscaling_param_sweep:
    strategy: grid
    params:
      "autoscaling_config.min_cluster_lifetime_s": [ 1200.0, 3600.0 ]
      "autoscaling_config.idle_time_before_tear_down_s": [ 300.0, 600.0 ]
      "autoscaling_config.observation_window_s": [ 120.0, 300.0 ]
      "autoscaling_config.min_observations_to_act": [ 5, 10 ]
      "autoscaling_config.slo_tightening_factor": [ 0.6, 0.8, 1.0 ]
  routing_param_sweep: {}

  static_baselines:
    - label: "16 RPU"
      overrides:
        managed_cluster_pool_config.initial_rpus: [ 16 ]
        autoscaling_config.allowed_rpu_sizes: []
        autoscaling_config.capacity_checkpoints: []
        routing_config.routing_policy: "round_robin"
    - label: "16+16 RPU"
      overrides:
        managed_cluster_pool_config.initial_rpus: [ 16, 16 ]
        autoscaling_config.allowed_rpu_sizes: []
        autoscaling_config.capacity_checkpoints: []
        routing_config.routing_policy: "round_robin"
    - label: "32 RPU"
      overrides:
        managed_cluster_pool_config.initial_rpus: [ 32 ]
        autoscaling_config.allowed_rpu_sizes: []
        autoscaling_config.capacity_checkpoints: []
        routing_config.routing_policy: "round_robin"
    - label: "32+32 RPU"
      overrides:
        managed_cluster_pool_config.initial_rpus: [ 32, 32 ]
        autoscaling_config.allowed_rpu_sizes: []
        autoscaling_config.capacity_checkpoints: []
        routing_config.routing_policy: "round_robin"
    - label: "64 RPU"
      overrides:
        managed_cluster_pool_config.initial_rpus: [ 64 ]
        autoscaling_config.allowed_rpu_sizes: []
        autoscaling_config.capacity_checkpoints: []
        routing_config.routing_policy: "round_robin"
