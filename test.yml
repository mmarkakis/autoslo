# History-window experiment: previous month (Apr 27 - May 26)

basic_config:
  schema_name: ext_tpcds1000
  iconq_model_id: "1771539369"
  run_id: "tuner_prev_month"

workload_config:
  workload_name: redbench_provisioned_157_0
  abs_start_time_start: "2024-05-27T00:00:00"
  abs_start_time_end: "2024-05-28T00:00:00"
  rescale_factor: 0.16666667
  closed_loop: false

slo_config:
  slo_s: 30.0
  slo_metric: binary
  slo_threshold: 0.05
  slo_dict_filename: ext_tpcds1000_rpu16_p90_k4.0.yml

runner_config:
  max_threads: 512
  
provisioner_config:
  relative_aws_config_path: data/__run_configs/aws.yml
  spin_up_delay_s: 300.0

managed_cluster_pool_config:
  maxconns: 1000
  initial_rpus:
    - 16

capacity_checkpoints: 
  - rel_time_s: 5438.450446128845
    min_rpus:
    - 16
    - 16

routing_config:
  routing_policy: use_iconq_model

autoscaling_config:
  allowed_rpu_sizes:
    - 4
    - 8
    - 16
    - 32
  min_cluster_lifetime_s: 1200.0
  idle_time_before_tear_down_s: 1200.0
  observation_window_s: 300.0
  min_observations_to_act: 5

output_config:
  experiment_name: TESTTEST
  overwrite_experiment: true
  write_text_log: false

tuner_config:
  force: false
  parallelism: auto
  holdout_evaluation: true

  forecast_config:
    history_abs_start_time_start: "2024-04-27T00:00:00"
    history_abs_start_time_end: "2024-05-27T00:00:00"
    forecast_policy: SameDayExponentialForecastPolicy
    decay_factor: 0.5
    num_scenarios: 20
    train_fraction: 0.6
    initial_seed: 42
    aggregation_metric: mean

  checkpoint_phase:
    max_checkpoints: 5
    min_delinquent_workload_fraction: 0.5
    min_rel_improvement_for_acceptance: 0.01

  autoscaling_param_sweep:
    "autoscaling_config.eta_crit": [0.05, 0.10, 0.20]
    "autoscaling_config.idle_periods_before_tear_down": [5, 10, 20]
    "autoscaling_config.capacity_poll_interval_s": [30.0, 60.0, 120.0]
    "autoscaling_config.min_cluster_lifetime_s": [1200.0, 3600.0]
  routing_param_sweep: {}

  static_baselines:
    - label: "16 RPU"
      overrides:
        managed_cluster_pool_config.initial_rpus: [16]
        autoscaling_config.allowed_rpu_sizes: []
        autoscaling_config.capacity_checkpoints: []
        routing_config.routing_policy: "round_robin"
    - label: "16+16 RPU"
      overrides:
        managed_cluster_pool_config.initial_rpus: [16, 16]
        autoscaling_config.allowed_rpu_sizes: []
        autoscaling_config.capacity_checkpoints: []
        routing_config.routing_policy: "round_robin"
    - label: "32 RPU"
      overrides:
        managed_cluster_pool_config.initial_rpus: [32]
        autoscaling_config.allowed_rpu_sizes: []
        autoscaling_config.capacity_checkpoints: []
        routing_config.routing_policy: "round_robin"
    - label: "32+32 RPU"
      overrides:
        managed_cluster_pool_config.initial_rpus: [32, 32]
        autoscaling_config.allowed_rpu_sizes: []
        autoscaling_config.capacity_checkpoints: []
        routing_config.routing_policy: "round_robin"
    - label: "64 RPU"
      overrides:
        managed_cluster_pool_config.initial_rpus: [64]
        autoscaling_config.allowed_rpu_sizes: []
        autoscaling_config.capacity_checkpoints: []
        routing_config.routing_policy: "round_robin"
