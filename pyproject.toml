# pyproject.toml
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "autoslo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.42.63",
    "botocore>=1.42.63",
    "cycler>=0.12.1",
    "intervaltree>=3.2.1",
    "ipython>=8.28.0",
    "matplotlib>=3.10.0",
    "mkdocs-gen-files>=0.5.0",
    "numpy>=2.2.2",
    "pandas>=2.2.3",
    "plotext>=5.3.2",
    "plotly>=6.5.1",
    "psycopg2>=2.9.9",
    "pyarrow>=22.0.0",
    "PyYAML>=6.0.1",
    "rich>=13.7.1",
    "scikit-learn>=1.5.2",
    "scipy>=1.14.0",
    "seaborn>=0.13.2",
    "sqlglot>=25.18.0",
    "torch>=2.7.0",
    "tqdm>=4.66.4",
    "xgboost>=2.1.1",
]
[project.optional-dependencies]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "mkdocs-literate-nav>=0.6",
    "mkdocs-section-index>=0.3",
    "mkdocs-gen-files>=0.5",
    "markdown-include>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"autoslo" = ["py.typed"]

[tool.black]
line-length = 80

[tool.deptry]
known_first_party = ["autoslo"]
