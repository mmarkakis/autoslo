### Basic Configuration
basic_config:
  schema_name: ext_tpcds1000
  workload_name: test_workload
  experiment_name: test_experiment
  overwrite_experiment: true
  simulator_run_id: test_run
  iconq_model_id: "1771539369"

### SLO Configuration
slo_config:
  slo_s: 30.0
  slo_metric: relative
  slo_threshold: 1

### Cluster Pool Configuration
managed_cluster_pool_config:
  initial_rpus:
    - 4
    - 32
  allowed_rpu_sizes:
    - 4
    - 8
    - 16
    - 32
  spin_up_delay_s: 120.0

### Query Routing Configuration
routing_config:
  routing_policy: model
  

### Autoscaling Configuration
autoscaling_config:
  autoscaling_policy: headroom
  eta_crit: 0.1
  idle_periods_before_tear_down: 5
  capacity_poll_interval_s: 60.0
  min_cluster_lifetime_s: 1200.0
  capacity_checkpoints:
    - time_s: 180.0
      min_rpus: [8]


### Output Configuration
output_config:
  verbose: true
  export_video: false

### Runner Configuration (live execution only)
runner_config:
  maxconns: 1000
  closed_loop: false
  aws_config_path: data/__run_configs/aws.yml
  # Provisioner fields here override anything from aws_config_path.
  # provisioner:
  #   type: redshift_serverless
  #   aws_account_id: "123456789012"
