### Basic Configuration
basic_config:
  experiment_name: test_experiment
  overwrite_experiment: true
  simulator_run_id: test_run
  iconq_model_id: "1771539369"

### Workload Configuration
workload_config:
  schema_name: ext_tpcds1000
  workload_name: test_workload
  # Optionally restrict to a time slice of the workload:
  # abs_start_time_start: "2024-01-01T00:00:00"
  # abs_start_time_end: "2024-01-01T01:00:00"
  # Optionally compress/expand inter-query gaps (factor < 1 = faster):
  # rescale_factor: 0.5
  closed_loop: false

### SLO Configuration
slo_config:
  slo_s: 30.0
  slo_metric: relative
  slo_threshold: 1

### Cluster Pool Configuration
managed_cluster_pool_config:
  initial_rpus:
    - 4
    - 32
  allowed_rpu_sizes:
    - 4
    - 8
    - 16
    - 32
  spin_up_delay_s: 120.0

### Query Routing Configuration
routing_config:
  routing_policy: model
  

### Autoscaling Configuration
autoscaling_config:
  autoscaling_policy: headroom
  eta_crit: 0.1
  idle_periods_before_tear_down: 5
  capacity_poll_interval_s: 60.0
  min_cluster_lifetime_s: 1200.0
  capacity_checkpoints:
    - time_s: 180.0
      min_rpus: [8]


### Output Configuration
output_config:
  verbose: true
  export_video: false

### Runner Configuration (live execution only)
runner_config:
  maxconns: 1000
  aws_config_path: data/__run_configs/aws.yml
  # Provisioner fields here override anything from aws_config_path.
  # provisioner:
  #   type: redshift_serverless
  #   aws_account_id: "123456789012"
  #   # max_capacity_ratio: ratio of maxCapacity to baseCapacity (default: 1).
  #   # E.g. 4 allows the workgroup to scale up to 4x its base RPUs.
  #   max_capacity_ratio: 1
  #   # price_performance_target_level: integer price/performance target level.
  #   # Valid values: 1 (LOW_COST), 25 (ECONOMICAL), 50 (BALANCED),
  #   #               75 (RESOURCEFUL), 100 (HIGH_PERFORMANCE).
  #   # Omit to use the AWS default.
  #   price_performance_target_level: 50
