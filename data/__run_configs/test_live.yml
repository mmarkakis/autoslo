### Basic Configuration
basic_config:
  schema_name: ext_tpcds1000
  experiment_name: test_experiment
  overwrite_experiment: true
  simulator_run_id: test_run
  iconq_model_id: "1771539369"

### Workload Configuration
workload_config:
  workload_name: test_workload
  # NOTE: This was a 1-minute window before the date-only schema migration;
  # it is now a full-day window (acceptable for the synthetic test workload).
  date: "2026-01-01"
  # rescale_factor: 0.5
  closed_loop: false

### SLO Configuration
slo_config:
  slo_s: 30.0
  slo_metric: relative
  slo_threshold: 1

### Cluster Pool Configuration
managed_cluster_pool_config:
  initial_rpus:
    - 8

### Query Routing Configuration
routing_config:
  routing_policy: round_robin

### Autoscaling Configuration
autoscaling_config:
  autoscaling_policy: noop

### Output Configuration
output_config:
  verbose: true
  export_video: false

### Runner Configuration (live execution only)
runner_config:
  maxconns: 1000
  aws_config_path: data/__run_configs/aws.yml

