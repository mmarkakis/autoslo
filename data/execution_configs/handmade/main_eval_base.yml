workload_config:
  workload_name: redbench_provisioned_157_0
  target_date: "<TARGET_DATE>"
  rescale_factor: 0.16666667

slo_resolver_config:
  slo_s: 30.0
  slo_dict_filename: "1778469201294_p100_k<KAPPA>.yml"

slo_objective_config:
  slo_metric: binary
  slo_threshold: <SLO_THRESHOLD>

provisioner_config:
  aws_config_path: data/config/aws.yml
  spin_up_delay_s: 300.0

workload_runner_config:
  max_threads: 512
  schema_name: ext_tpcds1000
  closed_loop: false

managed_cluster_pool_config:
  maxconns: 1000
  max_clusters: 8
  initial_rpus:
    - 16

scheduled_spinups: []

query_router_config:
  routing_policy_name: use_iconq_model
  iconq_model_id: all_66_and_99_template_runs

autoscaler_config:
  allowed_rpu_sizes:
    - 4
    - 8
    - 16
    - 32
  autoscaling_policy: add_single_best_forward
  min_cluster_lifetime_s: 1200.0
  idle_time_before_tear_down_s: 1200.0
  observation_window_s: 300.0
  min_observations_to_act: 5
  slo_tightening_factor: 0.8
  min_finished_queries_in_counterfactual: 30
