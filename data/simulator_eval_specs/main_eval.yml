# Run with:
#   python src/autoslo/experiments/run_eval.py main_eval

evaluation_id: main_eval

# Optional: explicit worker cap. null → deg_of_parallelism().
max_workers: null

workload_runs:

  # ── Canonical evaluation day (May 27) ───────────────────────────────
  # All observation_period, slo_strictness, and slo_difficulty trials are
  # evaluated on this single target day.
  - workload_config:
      workload_name: redbench_provisioned_157_0
      start_date_inclusive: "2024-05-27"
      end_date_inclusive: "2024-05-27"
      rescale_factor: 0.16666667
    trials:
      - spec_dir: experiments/9991_main_experiments/observation_period
        trial_ids: null   # null → all trials in this spec
      - spec_dir: experiments/9991_main_experiments/slo_strictness
        trial_ids: null
      - spec_dir: experiments/9991_main_experiments/slo_difficulty
        trial_ids: null
    baselines:
      - exec_config: data/execution_configs/handmade/single_16.yml
        params: {TARGET_DATE: "2024-05-27"}
      - exec_config: data/execution_configs/handmade/round_robin_16_16.yml
        params: {TARGET_DATE: "2024-05-27"}
      - exec_config: data/execution_configs/handmade/single_32.yml
        params: {TARGET_DATE: "2024-05-27"}
      - exec_config: data/execution_configs/handmade/round_robin_32_32.yml
        params: {TARGET_DATE: "2024-05-27"}
      - exec_config: data/execution_configs/handmade/single_64.yml
        params: {TARGET_DATE: "2024-05-27"}

  # ── target_period: each trial is evaluated on its own target day ─────
