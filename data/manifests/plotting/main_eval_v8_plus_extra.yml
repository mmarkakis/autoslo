main_content:
  # Combines the original Figure 6 (cluster 157, main_eval_v8.yml) with the
  # extra-clusters generalization check (main_eval_v8_extra_clusters.yml) into
  # a single figure: cluster 157 (April 15, May 27), cluster 99 (May 27), and
  # cluster 184 (May 27), each at kappa=4/kappa=2. Same 5 points per panel and
  # formatting_ids, same cluster-agnostic SLO dicts
  # (1778469201294_p100_k<KAPPA>.yml), as both source manifests.
  layout:
    rows: 4
    cols: 2
    figsize: [8, 12]
    shared_xlim: true
    shared_ylim: true
    show_target_region: false
    suppress_subplot_titles: true

  panels:
    - row: 0
      col: 0
      title: "Cluster 157, April 15, κ=4"
      show_legend: upper right
      slo_objective_config:
        slo_metric: binary
        slo_threshold: 0
      slo_resolver_config:
        slo_s: 0.0
        slo_dict_filename: "1778469201294_p100_k4.yml"
      threshold_lines:
        - value: 0.10
          color: light_green
      points:
        - label: "Single 64"
          formatting_id: main_eval_64
          workload_config: *april15_workload_config_c157
          sim_execution_config: exec:handmade/main_eval_round_robin_v8.yml
          live_execution_config: exec:handmade/main_eval_round_robin.yml
          params:
            TARGET_DATE: "2024-04-15"
            INITIAL_RPU: [64]
        - label: "Round Robin 32+32"
          formatting_id: main_eval_32_32
          workload_config: *april15_workload_config_c157
          sim_execution_config: exec:handmade/main_eval_round_robin_v8.yml
          live_execution_config: exec:handmade/main_eval_round_robin.yml
          params:
            TARGET_DATE: "2024-04-15"
            INITIAL_RPU: [32, 32]
        - label: "RAIS - Balanced"
          formatting_id: main_eval_rais50
          workload_config: *april15_workload_config_c157
          sim_execution_config: exec:handmade/main_eval_rais_v8.yml
          live_execution_config: exec:handmade/main_eval_rais_v8.yml
          params:
            TARGET_DATE: "2024-04-15"
            RAIS_LEVEL: 50
            RAIS_MAX_CAPACITY: 128
        - label: "RAIS - High Perf."
          formatting_id: main_eval_rais100
          workload_config: *april15_workload_config_c157
          sim_execution_config: exec:handmade/main_eval_rais_v8.yml
          live_execution_config: exec:handmade/main_eval_rais_v8.yml
          params:
            TARGET_DATE: "2024-04-15"
            RAIS_LEVEL: 100
            RAIS_MAX_CAPACITY: 128
        - label: "AutoSLO"
          formatting_id: main_eval_chosen
          workload_config: *april15_workload_config_c157
          execution_config: exec:tuned/april15_1month_k4_thresh10_nocache_v8.yml

