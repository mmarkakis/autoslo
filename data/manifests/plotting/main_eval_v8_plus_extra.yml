locals:
  april15_workload_config_c157: &april15_workload_config_c157
    workload_name: redbench_provisioned_157_0
    target_date: "2024-04-15"
    rescale_factor: 0.16666667
  may27_workload_config_c157: &may27_workload_config_c157
