locals:
  may27_workload_config_c135: &may27_workload_config_c135
    workload_name: redbench_provisioned_135_0
    target_date: "2024-05-27"
    rescale_factor: 0.16666667
  may27_workload_config_c105: &may27_workload_config_c105
    workload_name: redbench_provisioned_105_0
    target_date: "2024-05-27"
    rescale_factor: 0.16666667

main_content:
  # Companion to main_eval_v8.yml's Figure 6, extending the paper's end-to-end
  # evaluation to the two additional clusters (135, 105) chosen for
  # generalization (see agent_planning/20260916_additional_redset_clusters_for_paper.md).
  # Same May 27 workload/day as Figure 6, same 5 points per panel and
  # formatting_ids (for consistent styling/legend across both figures), same
  # cluster-agnostic SLO dicts (1778469201294_p100_k<KAPPA>.yml).
  layout:
    rows: 2
    cols: 2
    figsize: [8, 6]
    shared_xlim: true
    shared_ylim: true
    show_target_region: false
    suppress_subplot_titles: true

  panels:
    - row: 0
      col: 0
      title: "Cluster 135, May 27, κ=4"
      show_legend: upper right
      slo_objective_config:
        slo_metric: binary
        slo_threshold: 0
      slo_resolver_config:
        slo_s: 0.0
        slo_dict_filename: "1778469201294_p100_k4.yml"
      threshold_lines:
        - value: 0.10
          color: light_green
      points:
        - label: "Single 64"
          formatting_id: main_eval_64
          workload_config: *may27_workload_config_c135
          sim_execution_config: exec:handmade/main_eval_round_robin_v8_c135.yml
          live_execution_config: exec:handmade/main_eval_round_robin_c135.yml
          params:
            TARGET_DATE: "2024-05-27"
            INITIAL_RPU: [64]
        - label: "Round Robin 32+32"
          formatting_id: main_eval_32_32
          workload_config: *may27_workload_config_c135
          sim_execution_config: exec:handmade/main_eval_round_robin_v8_c135.yml
          live_execution_config: exec:handmade/main_eval_round_robin_c135.yml
          params:
            TARGET_DATE: "2024-05-27"
            INITIAL_RPU: [32, 32]
        - label: "RAIS - Balanced"
          formatting_id: main_eval_rais50
          workload_config: *may27_workload_config_c135
          sim_execution_config: exec:handmade/main_eval_rais_v8_c135.yml
          live_execution_config: exec:handmade/main_eval_rais_v8_c135.yml
          params:
            TARGET_DATE: "2024-05-27"
            RAIS_LEVEL: 50
            RAIS_MAX_CAPACITY: 128
        - label: "RAIS - High Perf."
          formatting_id: main_eval_rais100
          workload_config: *may27_workload_config_c135
          sim_execution_config: exec:handmade/main_eval_rais_v8_c135.yml
          live_execution_config: exec:handmade/main_eval_rais_v8_c135.yml
          params:
            TARGET_DATE: "2024-05-27"
            RAIS_LEVEL: 100
            RAIS_MAX_CAPACITY: 128
        - label: "AutoSLO"
          formatting_id: main_eval_chosen
          workload_config: *may27_workload_config_c135
          execution_config: exec:tuned/may27_1month_k4_thresh10_nocache_v8_c135.yml

    - row: 0
      col: 1
      title: "Cluster 135, May 27, κ=2"
      show_legend: false
      slo_objective_config:
        slo_metric: binary
        slo_threshold: 0
      slo_resolver_config:
