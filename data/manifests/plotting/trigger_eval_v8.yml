locals:
  lambda_point2: &lambda_point2
    workload_name: poisson_99_1_3_0.2_42
    target_date: "2026-01-01"
    rescale_factor: 1
  lambda_point1: &lambda_point1
    workload_name: poisson_99_1_3_0.1_42
    target_date: "2026-01-01"
    rescale_factor: 1
  set1: &set1
    KAPPA: 4
    INITIAL_RPU: 8
  set2: &set2
    KAPPA: 4
    INITIAL_RPU: 16
  set3: &set3
    KAPPA: 2
    INITIAL_RPU: 8
  set4: &set4
    KAPPA: 2
    INITIAL_RPU: 16
  arrow: &arrow
    base_label: "No-Op"
    target_label: "Ours"


main_content:

  layout:
    rows: 2
    cols: 4
    figsize: [16, 6]
    shared_xlim: true
    shared_ylim: true
    show_target_region: false
    annotate_with_cluster_sizes: false



  panels:
  - row: 0
    col: 0
    title: "λ=0.1, κ=4, C=[8]"
    show_legend: true
    slo_objective_config:
      slo_metric: binary
      slo_threshold: 0.05
    slo_resolver_config:
      slo_s: 30.0
      slo_dict_filename: "1778469201294_p100_k4.yml"
    improvement_arrow: *arrow
    
    points:
      - label: "No-Op"
        formatting_id: trigger_noop
        workload_config: *lambda_point1
        execution_config: exec:handmade/autoscaler_eval_v8.yml
        params:
          AUTOSCALING_POLICY: noop
          <<: *set1
          OBSERVATION_WINDOW_S: 600.0
      - label: "Queue@32"
        formatting_id: trigger_queue_depth
        workload_config: *lambda_point1
        execution_config: exec:handmade/trigger_eval_v8.yml
        params:
