locals:
    default_configs_c135: &default_configs_c135
        initial_execution_config: "exec:handmade/main_eval_base_v8_c135"
        tuner_config: "tuner:forecasted_v8_c135"
    default_configs_c105: &default_configs_c105
        initial_execution_config: "exec:handmade/main_eval_base_v8_c105"
        tuner_config: "tuner:forecasted_v8_c105"
    may27_default_exec_params: &may27_default_exec_params
        TARGET_DATE: "2024-05-27"
        KAPPA: 4
        SLO_THRESHOLD: 0.10
    default_may27_sampling_tuner_params: &default_may27_sampling_tuner_params
        LAST_DAY_DATE_INCLUSIVE: "2024-05-26"
        NUM_DAYS: 30

main_content:
    # Extends the cluster-157-only sweep in main_eval_v8.yml with the two
    # additional clusters (135, 105) chosen for the paper's generalization
    # check (see agent_planning/20260916_additional_redset_clusters_for_paper.md).
    # Only May 27, kappa in {4, 2}, threshold = 0.10 is covered, matching the
    # "AutoSLO" points used in the extra-clusters companion to Figure 6.

    # Cluster 135, May 27, kappa = 4, threshold = 0.10
    may27_1month_k4_thresh10_nocache_v8_c135:
        configs: *default_configs_c135
        params:
            <<: [*may27_default_exec_params, *default_may27_sampling_tuner_params]

    # Cluster 135, May 27, kappa = 2, threshold = 0.10
    may27_1month_k2_thresh10_nocache_v8_c135:
        configs: *default_configs_c135
        params:
            <<: [*may27_default_exec_params, *default_may27_sampling_tuner_params]
            KAPPA: 2

    # Cluster 105, May 27, kappa = 4, threshold = 0.10
    may27_1month_k4_thresh10_nocache_v8_c105:
        configs: *default_configs_c105
        params:
            <<: [*may27_default_exec_params, *default_may27_sampling_tuner_params]

    # Cluster 105, May 27, kappa = 2, threshold = 0.10
    may27_1month_k2_thresh10_nocache_v8_c105:
        configs: *default_configs_c105
        params:
            <<: [*may27_default_exec_params, *default_may27_sampling_tuner_params]
            KAPPA: 2
