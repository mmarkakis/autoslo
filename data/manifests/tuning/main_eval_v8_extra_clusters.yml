locals:
    default_configs_c184: &default_configs_c184
        initial_execution_config: "exec:handmade/main_eval_base_v8_c184"
        tuner_config: "tuner:forecasted_v8_c184"
    default_configs_c99: &default_configs_c99
        initial_execution_config: "exec:handmade/main_eval_base_v8_c99"
        tuner_config: "tuner:forecasted_v8_c99"
    may27_default_exec_params: &may27_default_exec_params
        TARGET_DATE: "2024-05-27"
        KAPPA: 4
        SLO_THRESHOLD: 0.10
    default_may27_sampling_tuner_params: &default_may27_sampling_tuner_params
        LAST_DAY_DATE_INCLUSIVE: "2024-05-26"
        NUM_DAYS: 30

main_content:
    # Extends the cluster-157-only sweep in main_eval_v8.yml with two
    # additional clusters (184, 99) for May 27 and kappa in {4, 2},
    # threshold = 0.10.

    # Cluster 184, May 27, kappa = 4, threshold = 0.10
    may27_1month_k4_thresh10_nocache_v8_c184:
        configs: *default_configs_c184
        params:
            <<: [*may27_default_exec_params, *default_may27_sampling_tuner_params]

    # Cluster 184, May 27, kappa = 2, threshold = 0.10
    may27_1month_k2_thresh10_nocache_v8_c184:
        configs: *default_configs_c184
        params:
            <<: [*may27_default_exec_params, *default_may27_sampling_tuner_params]
            KAPPA: 2

    # Cluster 99, May 27, kappa = 4, threshold = 0.10
    may27_1month_k4_thresh10_nocache_v8_c99:
        configs: *default_configs_c99
        params:
            <<: [*may27_default_exec_params, *default_may27_sampling_tuner_params]

    # Cluster 99, May 27, kappa = 2, threshold = 0.10
    may27_1month_k2_thresh10_nocache_v8_c99:
        configs: *default_configs_c99
        params:
            <<: [*may27_default_exec_params, *default_may27_sampling_tuner_params]
            KAPPA: 2


