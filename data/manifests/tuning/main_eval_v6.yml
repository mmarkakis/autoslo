locals:
    default_configs: &default_configs
        initial_execution_config: "exec:handmade/main_eval_base_v6"
        tuner_config: "tuner:sampled_nocache_v6"
    oracle_configs: &oracle_configs
        initial_execution_config: "exec:handmade/main_eval_base_v6"
        tuner_config: "tuner:groundtruth_nocache_v6"
    may27_default_exec_params: &may27_default_exec_params
        TARGET_DATE: "2024-05-27"
        KAPPA: 4
        SLO_THRESHOLD: 0.05
    default_sampling_tuner_params: &default_sampling_tuner_params
        LAST_DAY_DATE_INCLUSIVE: "2024-05-26"
        NUM_DAYS: 30

main_content:
    # kappa = 4, threshold = 0.05
    may27_1month_k4_thresh5_nocache_v6:
        configs: *default_configs
        params:
            <<: [*may27_default_exec_params, *default_sampling_tuner_params]
    may27_1week_k4_thresh5_nocache_v6:
        configs: *default_configs
        params:
            <<: [*may27_default_exec_params, *default_sampling_tuner_params]
            NUM_DAYS: 7
    may27_1day_k4_thresh5_nocache_v6:
        configs: *default_configs
        params:
            <<: [*may27_default_exec_params, *default_sampling_tuner_params]
            NUM_DAYS: 1
    may27_oracle_k4_thresh5_nocache_v6:
