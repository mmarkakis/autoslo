locals:
    default_configs: &default_configs
        initial_execution_config: "exec:handmade/main_eval_base_v4"
        tuner_config: "tuner:sampled_nocache_v4"
    oracle_configs: &oracle_configs
        initial_execution_config: "exec:handmade/main_eval_base_v4"
        tuner_config: "tuner:groundtruth_nocache_v4"
    may27_default_exec_params: &may27_default_exec_params
        TARGET_DATE: "2024-05-27"
        KAPPA: 4
        SLO_THRESHOLD: 0.05
    default_sampling_tuner_params: &default_sampling_tuner_params
        LAST_DAY_DATE_INCLUSIVE: "2024-05-26"
        NUM_DAYS: 30

main_content:
    # kappa = 8
    may27_1month_k8_thresh5_nocache_v4:
        configs: *default_configs
        params:
            <<: [*may27_default_exec_params, *default_sampling_tuner_params]
            KAPPA: 8
    may27_1month_k8_thresh10_nocache_v4:
        configs: *default_configs
        params:
            <<: [*may27_default_exec_params, *default_sampling_tuner_params]
            KAPPA: 8
            SLO_THRESHOLD: 0.10
    may27_oracle_k8_thresh5_nocache_v4:
        configs: *oracle_configs
        params:
            <<: *may27_default_exec_params
            KAPPA: 8
    may27_oracle_k8_thresh10_nocache_v4:
        configs: *oracle_configs
        params:
            <<: *may27_default_exec_params
            KAPPA: 8
            SLO_THRESHOLD: 0.10

    # kappa = 4
    may27_1month_k4_thresh5_nocache_v4:
        configs: *default_configs
        params:
            <<: [*may27_default_exec_params, *default_sampling_tuner_params]
    may27_1month_k4_thresh10_nocache_v4:
        configs: *default_configs
        params:
            <<: [*may27_default_exec_params, *default_sampling_tuner_params]
            SLO_THRESHOLD: 0.10
    may27_oracle_k4_thresh5_nocache_v4:
        configs: *oracle_configs
        params:
            <<: *may27_default_exec_params
    may27_oracle_k4_thresh10_nocache_v4:
        configs: *oracle_configs
        params:
            <<: *may27_default_exec_params
            SLO_THRESHOLD: 0.10

    # kappa = 2
    may27_1month_k2_thresh5_nocache_v4:
        configs: *default_configs
        params:
            <<: [*may27_default_exec_params, *default_sampling_tuner_params]
            KAPPA: 2
    may27_1month_k2_thresh10_nocache_v4:
        configs: *default_configs
        params:
            <<: [*may27_default_exec_params, *default_sampling_tuner_params]
            KAPPA: 2
            SLO_THRESHOLD: 0.10
    may27_oracle_k2_thresh5_nocache_v4:
        configs: *oracle_configs
        params:
            <<: *may27_default_exec_params
            KAPPA: 2
    may27_oracle_k2_thresh10_nocache_v4:
        configs: *oracle_configs
        params:
            <<: *may27_default_exec_params
            KAPPA: 2
            SLO_THRESHOLD: 0.10

