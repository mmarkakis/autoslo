sampling_config:
  num_scenarios: 1
  seed: 42

checkpoint_optimizer_config:
  max_checkpoints: 5
  min_delinquent_workload_fraction: 0.5
  min_rel_improvement_for_acceptance: 0.01
  lead_time_s: 360.0
  allowed_rpu_sizes: [ 4, 8, 16, 32 ]
  initial_rpu_candidates:
    - [ 16 ]
    - [ 8 ]
    - [ 32 ]

autoscaling_param_sweep:
  param_sweep_config:
    params:
      "autoscaler_config.min_cluster_lifetime_s": [ 1200.0, 3600.0 ]
      "autoscaler_config.idle_time_before_tear_down_s": [ 300.0, 600.0 ]
      "autoscaler_config.observation_window_s": [ 120.0, 300.0 ]
      "autoscaler_config.min_observations_to_act": [ 5, 10 ]
      "autoscaler_config.slo_tightening_factor": [ 0.6, 0.8, 1.0 ]

query_routing_param_sweep:
  param_sweep_config:
    params:
      "query_router_config.routing_policy_name": [ "cache_aware" ]
      "query_router_config.cluster_cache_state_update_alpha": [ 0.5, 0.7, 0.9 ]
      "query_router_config.cache_risk_cost_multiplier": [ 0.0, 0.5, 1.0 ]
      "query_router_config.cache_risk_coverage": [ 0.5, 0.7, 0.9 ]
      "query_router_config.forecaster_config":
        - forecast_policy_name: same_day_exponential
          decay_factor: 0.5
          fixed_queries_per_hour: 100
          reservoir_config:
            workload_name: redbench_provisioned_157_0
            start_date_inclusive: "<PAST_PERIOD_START_DATE>"
            end_date_inclusive: "<PAST_PERIOD_END_DATE>"
            rescale_factor: 0.16666667
