sampling_config:
  num_scenarios: 1
  seed: 42

slo_objective_config:
  slo_metric: binary
  slo_threshold: <SLO_THRESHOLD>

spinup_optimizer_config:
  max_spinups: 3
  min_delinquent_workload_fraction: 0.5
  lead_time_s: 360.0
  allowed_rpu_sizes: [4, 8, 16, 32]
  max_attempts_per_round: 5
  initial_rpu_candidates:
    - [16]
    - [8]
    - [32]

autoscaling_param_sweep:
  param_sweep_config:
    strategy: adaptive_batch
    params:
      "autoscaler_config.min_cluster_lifetime_s": [300.0, 3600.0]
      "autoscaler_config.idle_time_before_tear_down_s": [300.0, 3600.0]
      "autoscaler_config.observation_window_s": [30.0, 600.0]
      "autoscaler_config.min_observations_to_act": [5, 50]
      "autoscaler_config.slo_tightening_factor": [0.5, 1.5]
      "autoscaler_config.min_finished_queries_in_counterfactual": [5, 30]

query_routing_param_sweep:
  param_sweep_config:
    params: {}
